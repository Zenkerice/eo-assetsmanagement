<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js"></script>
  <script src="js/utils.js?v=2"></script>
  <link rel="stylesheet" href="css/theme.css?v=8" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories &ndash; EmpireOne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0e1a;
      --bg2:       #0f1729;
      --bg3:       #162040;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.12);
      --text:      #e8eaf0;
      --muted:     #6b7080;
      --muted2:    #9aa0b2;
      --blue:      #29b6e8;
      --blue-dim:  rgba(41,182,232,0.12);
      --green:     #3ecf8e;
      --green-dim: rgba(62,207,142,0.12);
      --red:       #f45b69;
      --red-dim:   rgba(244,91,105,0.12);
      --amber:     #f5a623;
      --amber-dim: rgba(245,166,35,0.12);
      --purple:    #9b73f7;
      --purple-dim:rgba(155,115,247,0.15);
      --radius:    14px;
      --radius-sm: 8px;
      --sidebar-w: 260px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      font-size: 16px;
    }

    /* -- Layout ---------------------------------- */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }

    .content { padding: 28px 48px 56px; }

    /* -- Stat Cards ------------------------------ */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px 18px;
    }
    .stat-card-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .stat-card-label .lbl-icon { font-size: 14px; }
    .stat-card-value {
      font-family: 'Syne', sans-serif;
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .stat-card-sub { font-size: 13px; color: var(--muted); }
    .stat-card.blue  .stat-card-label { color: var(--blue); }
    .stat-card.green .stat-card-label { color: var(--green); }
    .stat-card.amber .stat-card-label { color: var(--amber); }
    .stat-card.purple .stat-card-label { color: var(--purple); }
    .stat-card.blue  .stat-card-value { color: var(--blue); }
    .stat-card.green .stat-card-value { color: var(--green); }
    .stat-card.amber .stat-card-value { color: var(--amber); }
    .stat-card.purple .stat-card-value { color: var(--purple); }

    /* -- Toolbar --------------------------------- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-wrap {
      flex: 1;
      position: relative;
      max-width: 480px;
    }
    .search-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 11px 16px 11px 40px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: var(--blue); }

    .toolbar-spacer { flex: 1; }

    /* -- Buttons --------------------------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid var(--border2);
      text-decoration: none;
      white-space: nowrap;
      background: transparent;
      color: var(--muted2);
    }
    .btn:hover { background: var(--bg3); color: var(--text); }
    .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-primary:hover { background: #6b9ef8; border-color: #6b9ef8; }
    .btn-danger  { background: var(--red-dim); color: var(--red); border-color: rgba(244,91,105,0.25); }
    .btn-danger:hover  { background: rgba(244,91,105,0.22); }
    .btn-sm { padding: 7px 13px; font-size: 13px; }
    .btn-icon {
      padding: 9px 11px;
      font-size: 15px;
    }
    .btn-icon.active { background: var(--bg3); color: var(--text); }

    /* Sort button */
    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--muted2);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .sort-btn:hover { background: var(--bg3); color: var(--text); }

    /* -- Card / Table ---------------------------- */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 13px 20px;
      text-align: left;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }
    tbody td {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 14px;
      color: var(--text);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }

    /* Name cell */
    .cat-cell { display: flex; align-items: center; gap: 14px; }
    .cat-icon-wrap {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
      background: var(--purple-dim);
      border: 1px solid rgba(155,115,247,0.2);
    }
    .cat-name { font-weight: 600; font-size: 15px; color: var(--text); line-height: 1.3; }
    .cat-slug {
      font-size: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }

    /* Description cell */
    .cat-desc {
      color: var(--muted2);
      font-size: 13px;
      line-height: 1.5;
      max-width: 220px;
    }

    /* Asset count badge */
    .asset-count-wrap { position: relative; display: inline-block; }
    .asset-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border2);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted2);
      font-family: 'DM Mono', monospace;
    }
    .asset-bar {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
      margin-top: 5px;
      min-width: 40px;
      transition: width 0.4s ease;
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-active { background: var(--green-dim); color: var(--green); }
    .badge-empty  { background: var(--amber-dim); color: var(--amber); }

    /* Date */
    .date-text { font-size: 13px; color: var(--muted2); white-space: nowrap; }

    /* Actions */
    .row-actions { display: flex; gap: 6px; align-items: center; }

    /* -- Grid view ------------------------------- */
    .cat-grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      padding: 20px;
    }
    .cat-grid-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px 18px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .cat-grid-card:hover { border-color: var(--purple); transform: translateY(-2px); }
    .cat-grid-card .gc-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: var(--purple-dim);
      border: 1px solid rgba(155,115,247,0.2);
      display: grid;
      place-items: center;
      font-size: 20px;
      margin-bottom: 14px;
    }
    .cat-grid-card .gc-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .cat-grid-card .gc-slug { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 12px; }
    .cat-grid-card .gc-count {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--purple);
      line-height: 1;
    }
    .cat-grid-card .gc-count-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* -- Empty state ----------------------------- */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-state p { font-size: 13.5px; }

    /* -- Modal ----------------------------------- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      animation: modalIn 0.2s ease;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }
    .modal-close {
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--muted2);
      width: 30px; height: 30px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s;
    }
    .modal-close:hover { color: var(--text); background: var(--border2); }
    .form-body { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted2);
    }
    .form-group input,
    .form-group textarea {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 12px 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--muted); }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--blue); }
    .form-group textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
    .form-actions {
      display: flex;
      gap: 10px;
      padding: 20px 28px 28px;
      border-top: 1px solid var(--border);
    }

    /* -- Toast ----------------------------------- */
    #toast-container {
      position: fixed;
      bottom: 24px; right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }
    .toast {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: 13px;
      color: var(--text);
      animation: slideUp 0.25s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 320px;
    }
    .toast.error   { border-color: var(--red);   color: var(--red); }
    .toast.success { border-color: var(--green);  color: var(--green); }

  </style>
</head>
<body>

<aside class="sidebar"></aside>

<div class="main">
  <div class="topbar">
    <div>
      <h1>Categories</h1>
      <div class="topbar-sub" id="topbar-sub">Loading&hellip;</div>
    </div>
    <div class="topbar-actions">
      <button class="btn" onclick="exportCSV()">&#8595; Export</button>
      <button class="btn btn-primary" onclick="openModal()">+ Add category</button>
</div>
  </div>

  <div class="content">

    <!-- Stat cards -->
    <div class="stat-grid">
      <div class="stat-card blue">
        <div class="stat-card-label"><span class="lbl-icon">&#127991;</span> Total Categories</div>
        <div class="stat-card-value" id="stat-total">&#8211;</div>
        <div class="stat-card-sub">product groups</div>
      </div>
      <div class="stat-card green">
        <div class="stat-card-label"><span class="lbl-icon">&#11041;</span> Total Assets</div>
        <div class="stat-card-value" id="stat-assets">&#8211;</div>
        <div class="stat-card-sub">across all groups</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-card-label"><span class="lbl-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Largest Group</div>
        <div class="stat-card-value" id="stat-largest" style="font-size:22px;padding-top:4px;">&#8211;</div>
        <div class="stat-card-sub" id="stat-largest-sub"></div>
      </div>
      <div class="stat-card purple">
        <div class="stat-card-label"><span class="lbl-icon">&#9711;</span> Empty Categories</div>
        <div class="stat-card-value" id="stat-empty">&#8211;</div>
        <div class="stat-card-sub">no assets deployed</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="search" placeholder="Search by name or description&hellip;" oninput="filterTable()" />
      </div>
      <div class="toolbar-spacer"></div>
      <button class="sort-btn" id="sort-btn" onclick="toggleSort()">&#8645; Sort: <span id="sort-label">Name</span></button>
      <button class="btn btn-icon" id="view-list" title="List view" onclick="setView('list')">&#9776;</button>
      <button class="btn btn-icon" id="view-grid" title="Grid view" onclick="setView('grid')">&#8862;</button>
    </div>

    <!-- Table / Grid container -->
    <div class="card" id="cat-container">
      <div class="table-wrap" id="list-view">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th style="text-align:center;">Assets</th>
              <th>Status</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="category-table">
            <tr><td colspan="6">
              <div class="empty-state"><p>Loading&hellip;</p></div>
            </td></tr>
          </tbody>
        </table>
      </div>
      <div id="grid-view" style="display:none;"></div>
    </div>

  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Add Category</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="form-body">
      <form id="cat-form" onsubmit="submitForm(event)" style="display:contents;">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" name="name" placeholder="e.g. Electronics, Furniture&hellip;" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" placeholder="Optional description&hellip;"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Category</button>
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js?v=24"></script>
<script src="js/auth.js?v=5"></script>
<script src="js/toast.js?v=2"></script>
<script src="js/sidebar.js?v=61"></script>
<script>
  auth.initPage({ onReady: () => loadCategories() });

  let editingId     = null;
  let allCategories = [];
  let catCounts     = {};   // { id: assetCount }
  let sortAsc       = true;
  let currentView   = 'list';

  function slugify(s) {
    return (s || '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  }

  async function loadCategories() {
    try {
      const [catRes, prodRes] = await Promise.all([
        api.getCategories(),
        api.getProducts(),
      ]);
      allCategories = catRes.data;

      // Apply location filter from dashboard context
      let products = prodRes.data || [];
      const locId = localStorage.getItem('emp_location_id');
      if (locId) {
        products = products.filter(p => String(p.location_id) === locId);
        const locName = localStorage.getItem('emp_location_name') || 'Selected Location';
        showLocationBadge(locName);
      }

      // Build asset count map
      catCounts = {};
      products.forEach(p => {
        if (p.category_id) catCounts[p.category_id] = (catCounts[p.category_id] || 0) + 1;
      });

      updateStats();
      filterTable();
    } catch (e) { showToast(e.message, 'error'); }
  }

  function updateStats() {
    const total      = allCategories.length;
    const totalAssets = Object.values(catCounts).reduce((a, b) => a + b, 0);
    const emptyCats  = allCategories.filter(c => !catCounts[c.id]).length;

    // Largest group
    let largestCat = null, largestCount = 0;
    allCategories.forEach(c => {
      const n = catCounts[c.id] || 0;
      if (n > largestCount) { largestCount = n; largestCat = c; }
    });

    document.getElementById('stat-total').textContent  = total;
    document.getElementById('stat-assets').textContent = totalAssets;
    document.getElementById('stat-empty').textContent  = emptyCats;

    const largestEl    = document.getElementById('stat-largest');
    const largestSubEl = document.getElementById('stat-largest-sub');
    if (largestCat) {
      largestEl.textContent    = largestCat.name;
      largestSubEl.textContent = largestCount + ' asset' + (largestCount !== 1 ? 's' : '');
    } else {
      largestEl.textContent    = '�';
      largestSubEl.textContent = '';
    }

    // Topbar subtitle
    const now = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    document.getElementById('topbar-sub').textContent = total + ' product group' + (total !== 1 ? 's' : '') + ' \u00b7 ' + now;
  }

  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    let data = allCategories.filter(c =>
      !q || c.name.toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q)
    );
    // Sort
    data = data.slice().sort((a, b) => {
      const cmp = a.name.localeCompare(b.name);
      return sortAsc ? cmp : -cmp;
    });
    if (currentView === 'grid') renderGrid(data);
    else renderTable(data);
  }

  function toggleSort() {
    sortAsc = !sortAsc;
    document.getElementById('sort-label').textContent = sortAsc ? 'Name' : 'Name \u2193';
    filterTable();
  }

  function setView(v) {
    currentView = v;
    document.getElementById('list-view').style.display = v === 'list' ? '' : 'none';
    document.getElementById('grid-view').style.display = v === 'grid' ? '' : 'none';
    document.getElementById('view-list').classList.toggle('active', v === 'list');
    document.getElementById('view-grid').classList.toggle('active', v === 'grid');
    filterTable();
  }

  // Initialise view toggle state
  document.getElementById('view-list').classList.add('active');

  const maxCount = () => Math.max(1, ...allCategories.map(c => catCounts[c.id] || 0));

  function renderTable(data) {
    const tbody = document.getElementById('category-table');
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="6">
        <div class="empty-state">
          <div class="empty-icon">&#127991;&#65039;</div>
          <p>No categories found</p>
        </div>
      </td></tr>`;
      return;
    }

    const mx = maxCount();
    tbody.innerHTML = data.map(c => {
      const count   = catCounts[c.id] || 0;
      const barPct  = Math.round((count / mx) * 100);
      const isEmpty = count === 0;
      const slug    = slugify(c.name);
      const date    = new Date(c.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
      const descTxt = c.description
        ? (c.description.length > 60 ? c.description.slice(0, 57) + '&hellip;' : c.description)
        : '<span style="color:var(--muted)">&#8211;</span>';

      return `
        <tr>
          <td>
            <div class="cat-cell">
              <div class="cat-icon-wrap">&#127991;&#65039;</div>
              <div>
                <div class="cat-name">${esc(c.name)}</div>
                <div class="cat-slug">${slug}</div>
              </div>
            </div>
          </td>
          <td><div class="cat-desc">${descTxt}</div></td>
          <td style="text-align:center;">
            <div class="asset-count-wrap" style="display:inline-block;">
              <div class="asset-count">${count}</div>
              <div class="asset-bar" style="width:${Math.max(barPct, 8)}%;"></div>
            </div>
          </td>
          <td>
            <span class="badge ${isEmpty ? 'badge-empty' : 'badge-active'}">
              ${isEmpty ? 'Empty' : 'Active'}
            </span>
          </td>
          <td><span class="date-text">${date}</span></td>
          <td>
            <div class="row-actions">
              <a href="items.html?category_id=${c.id}" class="btn btn-sm">&#128065; View</a>
              <button class="btn btn-sm btn-icon" title="Edit" data-id="${c.id}"
                data-name="${esc(c.name)}"
                data-desc="${esc(c.description || '')}"
                onclick="openModalFromBtn(this)">&#9998;</button>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  function renderGrid(data) {
    const gv = document.getElementById('grid-view');
    if (!data.length) {
      gv.innerHTML = `<div class="empty-state"><div class="empty-icon">&#127991;&#65039;</div><p>No categories found</p></div>`;
      return;
    }
    gv.innerHTML = `<div class="cat-grid-view">${data.map(c => {
      const count = catCounts[c.id] || 0;
      const slug  = slugify(c.name);
      return `
        <a href="items.html?category_id=${c.id}" style="text-decoration:none;color:inherit;">
          <div class="cat-grid-card">
            <div class="gc-icon">&#127991;&#65039;</div>
            <div class="gc-name">${esc(c.name)}</div>
            <div class="gc-slug">${slug}</div>
            <div class="gc-count">${count}</div>
            <div class="gc-count-label">${count === 1 ? 'asset' : 'assets'}</div>
          </div>
        </a>`;
    }).join('')}</div>`;
  }

  function openModalFromBtn(btn) {
    const id   = parseInt(btn.dataset.id);
    const name = btn.dataset.name;
    const desc = btn.dataset.desc;
    openModal(id, name, desc);
  }

  function openModal(id = null, name = '', desc = '') {
    editingId = id;
    const form = document.getElementById('cat-form');
    form.reset();
    document.getElementById('modal-title').textContent = id ? 'Edit Category' : 'Add Category';
    if (id) {
      form.name.value        = name;
      form.description.value = desc;
    }
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    editingId = null;
  }

  async function submitForm(e) {
    e.preventDefault();
    const form = e.target;
    const data = { name: form.name.value.trim(), description: form.description.value.trim() };
    try {
      if (editingId) {
        await api.updateCategory(editingId, data);
        showToast('Category updated', 'success');
      } else {
        await api.createCategory(data);
        showToast('Category created', 'success');
      }
      closeModal();
      loadCategories();
      refreshSidebar();
    } catch (e) { showToast(e.message, 'error'); }
  }

  async function deleteCategory(id) {
    if (!confirm('Delete this category?')) return;
    try {
      await api.deleteCategory(id);
      showToast('Category deleted', 'success');
      loadCategories();
      refreshSidebar();
    } catch (e) { showToast(e.message, 'error'); }
  }

  function exportCSV() {
    if (!allCategories.length) { showToast('No data to export', 'error'); return; }
    const rows = [['Name', 'Slug', 'Description', 'Assets', 'Created']];
    allCategories.forEach(c => {
      rows.push([
        c.name,
        slugify(c.name),
        c.description || '',
        catCounts[c.id] || 0,
        new Date(c.created_at).toLocaleDateString(),
      ]);
    });
    const csv  = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = 'categories.csv';
    a.click();
  }

  // Close modal on backdrop click
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
