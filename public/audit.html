<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log &mdash; EmpireOne</title>
  <script src="js/theme.js"></script>
  <script src="js/utils.js?v=2"></script>
  <link rel="stylesheet" href="css/theme.css?v=12" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Montserrat:wght@700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0e1a;--bg2:#0f1729;--bg3:#162040;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
      --text:#e8eaf0;--muted:#6b7080;--muted2:#9aa0b2;
      --blue:#29b6e8;--blue-dim:rgba(41,182,232,0.12);
      --green:#3ecf8e;--green-dim:rgba(62,207,142,0.12);
      --red:#f45b69;--red-dim:rgba(244,91,105,0.12);
      --amber:#f5a623;--amber-dim:rgba(245,166,35,0.12);
      --purple:#9b73f7;--purple-dim:rgba(155,115,247,0.15);
      --radius:14px;--radius-sm:8px;--sidebar-w:260px;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:16px}
    .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
    .event-count{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;color:var(--muted2)}
    .content{padding:24px 48px 56px}

    /* -- Filters -- */
    .filters{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;animation:slideUp 0.5s 0.08s cubic-bezier(0.16,1,0.3,1) both}
    .filter-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 16px;outline:none;transition:border-color .15s}
    .filter-input:focus{border-color:var(--blue)}
    .filter-input::placeholder{color:var(--muted)}
    .filter-select{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 14px;outline:none;cursor:pointer;transition:border-color .15s;appearance:none}
    .filter-select:focus{border-color:var(--blue)}
    .filter-select option{background:var(--bg2)}

    /* -- Reports section bar -- */
    .reports-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);animation:slideUp 0.5s 0.16s cubic-bezier(0.16,1,0.3,1) both;box-shadow:0 4px 20px rgba(0,0,0,0.18)}
    .reports-bar-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;white-space:nowrap}

    /* -- Period buttons -- */
    .period-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .period-btn{background:transparent;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:7px 15px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .period-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
    .period-btn.active{background:var(--bg3);border-color:var(--blue);color:var(--blue)}

    /* -- Summary line -- */
    .period-summary{font-size:13px;color:var(--muted);padding:0 2px}
    .period-summary strong{color:var(--text);font-weight:600}

    /* -- Custom datetime pickers -- */
    .custom-range{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm)}
    .custom-range.visible{display:flex}
    .custom-range input[type=datetime-local]{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 12px;outline:none;cursor:pointer;transition:border-color .15s;color-scheme:dark}
    .custom-range input[type=datetime-local]:focus{border-color:var(--blue)}
    .custom-sep{font-size:13px;color:var(--muted)}

    /* -- Log list -- */
    .log-list{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.18);transition:box-shadow 0.2s ease}
    .log-list:hover{box-shadow:0 8px 24px rgba(0,0,0,0.22)}
    .log-item{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;text-decoration:none;color:inherit}
    .log-item:last-child{border-bottom:none}
    .log-item:hover{background:rgba(255,255,255,0.025)}
    .log-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}
    .log-content{flex:1;min-width:0}
    .log-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
    .log-user{font-size:14px;font-weight:600;color:var(--text)}
    .log-entity-name{font-size:14px;font-weight:500;color:var(--text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .log-time{font-size:12px;color:var(--muted);margin-top:2px}
    .log-chevron{color:var(--muted);font-size:16px;flex-shrink:0;margin-top:10px}

    /* -- Action badges -- */
    .action-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
    .action-created  {background:rgba(62,207,142,0.15);color:var(--green);border:1px solid rgba(62,207,142,0.25)}
    .action-updated  {background:var(--blue-dim);color:var(--blue);border:1px solid rgba(79,142,247,0.25)}
    .action-deleted  {background:var(--red-dim);color:var(--red);border:1px solid rgba(244,91,105,0.25)}
    .action-assigned {background:var(--blue-dim);color:var(--blue);border:1px solid rgba(79,142,247,0.25)}
    .action-returned {background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,142,0.25)}
    .action-imported {background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,166,35,0.25)}
    .action-received {background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,142,0.25)}
    .action-disposed {background:var(--purple-dim);color:var(--purple);border:1px solid rgba(155,115,247,0.25)}
    .action-reported {background:var(--red-dim);color:var(--red);border:1px solid rgba(244,91,105,0.25)}
    .entity-chip{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:var(--muted2)}

    /* -- Empty / Pagination -- */
    .empty-state{text-align:center;padding:64px 20px;color:var(--muted)}
    .empty-state .empty-icon{font-size:36px;margin-bottom:12px}
    .empty-state p{font-size:13px}
    .pagination{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-top:1px solid var(--border);background:rgba(255,255,255,0.01)}
    .page-info{font-size:13px;color:var(--muted)}
    .page-btns{display:flex;gap:8px}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border2);background:transparent;color:var(--muted2);white-space:nowrap}
    .btn:hover{background:var(--bg3);color:var(--text)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn-primary:hover{background:#6b9ef8}
    .btn-sm{padding:6px 12px;font-size:12px}



  </style>
</head>
<body>
<aside class="sidebar"></aside>
<div class="main">
  <div class="topbar">
    <div>
      <div style="display:flex;align-items:center;gap:10px;">
        <h1>Audit Log</h1>
        <span class="event-count" id="event-count">Loading&hellip;</span>
      </div>
      <div class="topbar-sub" id="audit-date"></div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-sm" onclick="exportLog()">&#8595; Export &#8599;</button>
</div>
  </div>

  <div class="content">
    <div class="filters">

      <!-- Search -->
      <input class="filter-input" type="text" id="f-search"
             placeholder="Search by user, asset, or description&hellip;" oninput="debounceLoad()" />

      <!-- Action + User dropdowns side by side -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select class="filter-select" id="f-action" onchange="loadLogs(1)" style="flex:1;min-width:160px;">
          <option value="">All actions</option>
          <option value="created">&#43; Created</option>
          <option value="updated">&#9998; Updated</option>
          <option value="deleted">&#128465; Deleted</option>
          <option value="assigned">&#128100; Deployed</option>
          <option value="returned">&#8617; Returned</option>
          <option value="imported">&#8593; Imported</option>
          <option value="received">&#10003; Received</option>
          <option value="disposed">&#128465; Disposed</option>
          <option value="reported">&#9888; Reported</option>
        </select>
        <select class="filter-select" id="f-user" onchange="loadLogs(1)" style="flex:1;min-width:160px;">
          <option value="">All users</option>
        </select>
      </div>

      <!-- Reports bar with period buttons -->
      <div class="reports-bar">
        <div class="reports-bar-title">
          <span>&#128202;</span> Reports
        </div>
        <div class="period-row">
          <button class="period-btn" data-period="1day"   onclick="setPeriod('1day')">Last 1 day</button>
          <button class="period-btn" data-period="2days"  onclick="setPeriod('2days')">Last 2 days</button>
          <button class="period-btn" data-period="week"   onclick="setPeriod('week')">Last 7 days</button>
          <button class="period-btn" data-period="month"  onclick="setPeriod('month')">Last 30 days</button>
          <button class="period-btn" data-period="custom" onclick="setPeriod('custom')">Custom</button>
        </div>
      </div>

      <!-- Custom datetime pickers (hidden until Custom is clicked) -->
      <div class="custom-range" id="custom-range-row" style="border-top:1px solid var(--border);">
        <span style="font-size:13px;color:var(--muted2);font-weight:500;">From</span>
        <input type="datetime-local" id="f-from" onchange="loadLogs(1)" />
        <span class="custom-sep">to</span>
        <input type="datetime-local" id="f-to" onchange="loadLogs(1)" />
      </div>

      <!-- "Showing N reports from &mdash; to &mdash;" summary -->
      <div class="period-summary" id="period-summary" style="display:none;"></div>

    </div><!-- /.filters -->

    <div class="log-list" id="log-list">
      <div class="empty-state"><p>Loading&hellip;</p></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js?v=24"></script>
<script src="js/auth.js?v=9"></script>
<script src="js/toast.js?v=3"></script>
<script src="js/sidebar.js?v=88"></script>
<script>
auth.initPage({ onReady: async () => { await loadUsers(); loadLogs(1); } });

// Set date below the h1
document.getElementById('audit-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

let currentPage  = 1;
let totalPages   = 1;
let totalEvents  = 0;
let allLogs      = [];
let debTimer     = null;
let activePeriod = ''; // '' | '1day' | '2days' | 'week' | 'month' | 'custom'

/* -- Debounced search -- */
function debounceLoad() {
  clearTimeout(debTimer);
  debTimer = setTimeout(() => loadLogs(1), 350);
}

/* -- Period button click -- */
function setPeriod(p) {
  // Toggle off if same button clicked again
  if (activePeriod === p) {
    activePeriod = '';
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('custom-range-row').classList.remove('visible');
    loadLogs(1);
    return;
  }

  activePeriod = p;
  document.querySelectorAll('.period-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.period === p)
  );

  const customRow = document.getElementById('custom-range-row');
  if (p === 'custom') {
    customRow.classList.add('visible');
    // Pre-fill defaults if empty
    const now   = new Date();
    const prior = new Date(now.getTime() - 24 * 60 * 60 * 1000);
    if (!document.getElementById('f-to').value)
      document.getElementById('f-to').value   = toLocalDT(now);
    if (!document.getElementById('f-from').value)
      document.getElementById('f-from').value = toLocalDT(prior);
  } else {
    customRow.classList.remove('visible');
  }

  loadLogs(1);
}

/* -- Helpers -- */
function toLocalDT(date) {
  const pad = n => String(n).padStart(2, '0');
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
         'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}

function fmtDT(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' +
         date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

/* -- Update summary line -- */
function updatePeriodSummary(total) {
  const el = document.getElementById('period-summary');
  if (!activePeriod) { el.style.display = 'none'; return; }

  const toDate = new Date();
  let fromDate;

  if (activePeriod === 'custom') {
    const fv = document.getElementById('f-from').value;
    const tv = document.getElementById('f-to').value;
    if (!fv || !tv) { el.style.display = 'none'; return; }
    fromDate = new Date(fv);
    const toDateCustom = new Date(tv);
    el.style.display = '';
    el.innerHTML = 'Showing <strong>' + total + ' report' + (total !== 1 ? 's' : '') + '</strong>' +
      ' from <strong>' + fmtDT(fromDate) + '</strong>' +
      ' to <strong>'   + fmtDT(toDateCustom) + '</strong>';
    return;
  }

  const daysMap = { '1day': 1, '2days': 2, 'week': 7, 'month': 30 };
  fromDate = new Date(toDate.getTime() - (daysMap[activePeriod] || 1) * 24 * 60 * 60 * 1000);
  el.style.display = '';
  el.innerHTML = 'Showing <strong>' + total + ' report' + (total !== 1 ? 's' : '') + '</strong>' +
    ' from <strong>' + fmtDT(fromDate) + '</strong>' +
    ' to <strong>'   + fmtDT(toDate)   + '</strong>';
}

/* -- Load users for dropdown -- */
async function loadUsers() {
  try {
    const res = await api.getAuditUsers();
    const sel = document.getElementById('f-user');
    sel.innerHTML = '<option value="">All users</option>' +
      (res.data || []).map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
  } catch(e) {}
}

/* -- Main data load -- */
async function loadLogs(page = 1) {
  currentPage = page;

  const params = {
    page,
    per_page: 20,
    search: document.getElementById('f-search').value.trim(),
    action: document.getElementById('f-action').value,
    user:   document.getElementById('f-user').value,
  };

  if (activePeriod && activePeriod !== 'custom') {
    params.period = activePeriod;
  } else if (activePeriod === 'custom') {
    const fv = document.getElementById('f-from').value;
    const tv = document.getElementById('f-to').value;
    if (fv) params.from = fv.replace('T', ' ');
    if (tv) params.to   = tv.replace('T', ' ');
  }

  // Strip empty values
  Object.keys(params).forEach(k => { if (params[k] === '' || params[k] === undefined) delete params[k]; });

  document.getElementById('log-list').innerHTML =
    '<div class="empty-state"><p>Loading&hellip;</p></div>';

  try {
    const res   = await api.getAuditLogs(params);
    allLogs     = res.data || [];
    totalPages  = res.meta?.pages || 1;
    totalEvents = res.meta?.total || 0;
    document.getElementById('event-count').textContent =
      totalEvents + ' event' + (totalEvents !== 1 ? 's' : '');
    updatePeriodSummary(totalEvents);
    renderLogs(allLogs, res.meta);
  } catch(e) {
    document.getElementById('log-list').innerHTML =
      `<div class="empty-state"><div class="empty-icon">&#9888;</div><p>${esc(e.message)}</p></div>`;
  }
}

/* -- Render log rows -- */
function renderLogs(logs, meta) {
  const container = document.getElementById('log-list');
  if (!logs.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">&#128203;</div>
      <p>No audit events found</p>
    </div>`;
    return;
  }

  const rows = logs.map(log => {
    const color  = avatarColor(log.user_name);
    const ini    = initials(log.user_name);
    const badge  = actionBadge(log.action);
    const entity = entityChip(log.entity_type);
    const time   = formatTime(log.created_at);
    return `<div class="log-item">
      <div class="log-avatar" style="background:${color}">${esc(ini)}</div>
      <div class="log-content">
        <div class="log-header">
          <span class="log-user">${esc(log.user_name)}</span>
          ${badge}
          ${entity}
        </div>
        <div class="log-entity-name">${esc(log.entity_name || log.description || '?')}</div>
        <div class="log-time">${time}</div>
      </div>
      <span class="log-chevron">&#8250;</span>
    </div>`;
  }).join('');

  const from  = ((meta?.page || 1) - 1) * (meta?.per_page || 20) + 1;
  const to    = Math.min(from + logs.length - 1, meta?.total || logs.length);
  const total = meta?.total || logs.length;

  container.innerHTML = rows + `
    <div class="pagination">
      <span class="page-info">Showing ${from}&ndash;${to} of ${total}</span>
      <div class="page-btns">
        <button class="btn btn-sm" onclick="loadLogs(${currentPage - 1})"
          ${currentPage <= 1 ? 'disabled' : ''}>&#8592; Prev</button>
        <button class="btn btn-sm" onclick="loadLogs(${currentPage + 1})"
          ${currentPage >= totalPages ? 'disabled' : ''}>Next &#8594;</button>
      </div>
    </div>`;
}

/* -- Badge / chip helpers -- */
function actionBadge(action) {
  const icons = { created:'&#43;', updated:'&#9998;', deleted:'&#128465;', assigned:'&#128100;',
                  returned:'&#8617;', imported:'&#8593;', received:'&#10003;',
                  disposed:'&#128465;', reported:'&#9888;' };
  const map   = { created:'Created', updated:'Updated', deleted:'Deleted', assigned:'Deployed',
                  returned:'Returned', imported:'Imported', received:'Received',
                  disposed:'Disposed', reported:'Reported' };
  return `<span class="action-badge action-${action}">${icons[action]||'&#9679;'} ${map[action]||action}</span>`;
}

function entityChip(type) {
  if (!type) return '';
  return `<span class="entity-chip">${esc(type)}</span>`;
}

function avatarColor(name) {
  const colors = ['#4f8ef7','#3ecf8e','#f5a623','#9b73f7','#f45b69','#06b6d4','#f97316'];
  let h = 0;
  for (let i = 0; i < (name||'').length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return colors[Math.abs(h) % colors.length];
}

function initials(name) {
  return (name||'').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function formatTime(ts) {
  if (!ts) return '';
  const d    = new Date(ts);
  const now  = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60)   return 'Just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  const time = d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  if (now.toDateString() === d.toDateString())                   return 'Today, '     + time;
  if (new Date(now - 86400000).toDateString() === d.toDateString()) return 'Yesterday, ' + time;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) + ', ' + time;
}

/* -- Export -- */
function exportLog() {
  if (!allLogs.length) { showToast('No data to export', 'error'); return; }
  const rows = [['Time','User','Action','Entity Type','Entity Name','Description']];
  allLogs.forEach(l => rows.push([
    l.created_at, l.user_name, l.action, l.entity_type, l.entity_name||'', l.description||''
  ]));
  const csv  = rows.map(r => r.map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'audit_log.csv';
  a.click();
}
</script>
</body>
</html>
